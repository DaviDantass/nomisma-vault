# APPLICATION
spring.application.name=nomismavault
server.port=${PORT:8080}

# DATABASE - POSTGRESQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nomismavault}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:manager}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Logs SQL ( --- off : PROD --- )
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# FLYWAY
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# SECURITY / JWT
jwt.secret=${JWT_SECRET:NOMISMAVAULT_SECRET_KEY_CHANGE_ME}
jwt.expiration=${JWT_EXPIRATION:86400000}  # 24h em ms

# CACHE
spring.cache.type=simple
spring.cache.cache-names=assets,assetsByTicker,assetsByCategory,allAssets,stock-quotes,stock-info

# SWAGGER / OPENAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# LOGGING
logging.level.org.springframework=INFO
logging.level.com.davidantasdev.nomismavault=${APP_LOG_LEVEL:INFO}

# SCHEDULING
spring.task.scheduling.pool.size=5

# EXTERNAL API - BRAPI
brapi.api.url=${BRAPI_API_URL:https://brapi.dev/api}
brapi.api.token=${BRAPI_API_TOKEN:}
