spring.application.name=NomismaVault
server.port=8080

# DATABASE - POSTGRESQL
# Usa variáveis de ambiente com fallback para valores locais
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nomismavault}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:manager}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.open-in-view=false

# FLYWAY
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JPA PERFORMANCE
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.format_sql=false

# SECURITY / JWT
jwt.secret=${JWT_SECRET:MYINVEST_SECRET_KEY_SUPER_SECURE_2025}
jwt.expiration=${JWT_EXPIRATION:86400000}

# SWAGGER / OPENAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# CACHE CONFIGURATION
spring.cache.type=simple
spring.cache.cache-names=assets,assetsByTicker,assetsByCategory,allAssets

# LOGGING
logging.level.org.springframework=INFO
logging.level.com.myinvest=DEBUG

# SCHEDULING
spring.task.scheduling.pool.size=5

# EXTERNAL API - BRAPI
brapi.api.url=${BRAPI_API_URL:https://brapi.dev/api}
brapi.api.token=${BRAPI_API_TOKEN:}