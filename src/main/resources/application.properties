spring.application.name=AssetAPI
server.port=8080

# DATABASE - POSTGRESQL
spring.datasource.url=jdbc:postgresql://localhost:5432/assetapi
spring.datasource.username=postgres
spring.datasource.password=manager
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JPA PERFORMANCE
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.format_sql=false

# SECURITY / JWT
jwt.secret=MYINVEST_SECRET_KEY_SUPER_SECURE_2025
jwt.expiration=86400000

# SWAGGER / OPENAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# CACHE CONFIGURATION
spring.cache.type=simple
spring.cache.cache-names=assets,assetsByTicker,assetsByCategory,allAssets

# LOGGING
logging.level.org.springframework=INFO
logging.level.com.myinvest=DEBUG

# SCHEDULING
spring.task.scheduling.pool.size=5

# EXTERNAL API - BRAPI
brapi.api.url=https://brapi.dev/api
brapi.api.token=