name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate formatting
        run: ./mvnw -q spotless:check
      - name: Run unit and HTTP integration tests
        run: ./mvnw -q test
      - name: Verify Docker access for Testcontainers
        run: docker info
      - name: Validate Flyway migrations on PostgreSQL
        run: ./mvnw -q -DrunPostgresIT=true -Dtest=PostgreSqlFlywayTest test
      - name: Validate Docker Compose
        run: docker compose config --quiet
